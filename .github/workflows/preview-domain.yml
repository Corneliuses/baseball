name: Preview domain

# Points preview.coach.corneliuses.com and preview.baseball.corneliuses.com
# at the newest ready Preview deployment, so whichever PR was pushed last is
# the one that can sign in. preview.coach follows the production move to
# coach.corneliuses.com (#96); preview.baseball keeps working for links that
# already carry it. Both are registered redirect URIs with the auth service,
# but only the one Preview's AUTH_URL names can complete a login.
#
# Sign-in needs it: the auth service only redirects back to exactly registered
# URIs, and Preview's AUTH_URL is one of these domains, so a per-deploy *.vercel.app URL
# can never complete a login. Vercel itself can only tie a domain to one git
# branch, which is why this repoints it per deployment instead.
#
# One deployment, so the last push wins: two PRs open at once take turns. Vercel
# sends a deployment_status for every deployment it builds, and GitHub runs the
# copy of this file at the deployed commit, so a branch that predates it does
# not repoint the domain.
#
# The event only says "a preview finished". The job then aliases the newest
# ready Preview of the project, not the deployment that sent the event, so an
# older push that finishes building late cannot move the domain back.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  alias:
    name: Point the preview domain
    # Preview deployments of this team's project only. The repository also
    # deploys to a second Vercel project in another team, whose deployments
    # this token cannot alias; its URLs end differently.
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview') &&
      endsWith(github.event.deployment_status.environment_url, '-brcornelius-projects.vercel.app')
    runs-on: ubuntu-latest
    # Job-level, so events the `if` skips never queue here and displace a
    # pending run that would have aliased.
    concurrency:
      group: preview-domain
      cancel-in-progress: false
    env:
      DOMAINS: preview.coach.corneliuses.com preview.baseball.corneliuses.com
      TEAM_ID: team_FIGdad6vepcLwF2SoY16kp6I
      PROJECT_ID: prj_31ziJAWdjYvtgyiadphxIroTrS7P
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Alias the deployment
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The VERCEL_TOKEN repository secret is not set."
            exit 1
          fi
          host=$(curl --fail-with-body -sS --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?teamId=$TEAM_ID&projectId=$PROJECT_ID&target=preview&state=READY&limit=1" \
            | jq -er '.deployments[0].url')
          for domain in $DOMAINS; do
            echo "Pointing $domain at $host"
            curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v2/deployments/$host/aliases?teamId=$TEAM_ID" \
              -d "{\"alias\":\"$domain\"}"
          done
